<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavrova</title>
  <meta name="description" content="Pavrova Sosyal Medya Bağlantılarım.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#040810">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kişisel Web Sitesi">
  <meta property="og:description" content="Pavrova Sosyal Medya Bağlantılarım.">
  <link rel="icon" id="favicon" href="data:,">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="loader">
    <p class="loader-text">Pavrova</p>
    <div class="loader-track">
      <span class="loader-bar"></span>
    </div>
  </div>

  <div class="atmosphere" aria-hidden="true">
    <span class="orb orb-one"></span>
    <span class="orb orb-two"></span>
  </div>

  <main class="page">

    <header class="banner reveal">
      <img id="banner" alt="Banner görseli">
    </header>

    <section class="profile">
      <img id="avatar" class="avatar reveal" alt="Profil fotoğrafı">
      <h1 id="name" class="name reveal"></h1>
      <p id="description" class="description reveal"></p>
    </section>

    <nav id="socials" class="socials reveal" aria-label="Sosyal medya"></nav>

    <footer class="footer reveal">
      <p>Pavrova</p>
    </footer>

  </main>

</body>
</html>
